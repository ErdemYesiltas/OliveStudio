    <rect x="196" y="228" width="632" height="568" rx="56" fill="url(#grid)"/>
    <rect x="196" y="228" width="632" height="568" rx="56" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="3"/>
  </g>
  <circle cx="352" cy="404" r="82" fill="#f0a36c"/>
  <path d="M300 690 L398 528 L496 690 Z" fill="#a9d47c" stroke="#a9d47c" stroke-width="18" stroke-linejoin="round"/>
  <rect x="530" y="432" width="196" height="196" rx="40" fill="#7caef5"/>
  <rect x="508" y="410" width="240" height="240" rx="10" fill="none" stroke="#ff6fb1" stroke-width="8" stroke-dasharray="22 14"/>
  <g fill="#ffffff" stroke="#ff6fb1" stroke-width="8">
    <rect x="490" y="392" width="36" height="36" rx="8"/><rect x="730" y="392" width="36" height="36" rx="8"/>
    <rect x="490" y="632" width="36" height="36" rx="8"/><rect x="730" y="632" width="36" height="36" rx="8"/>
