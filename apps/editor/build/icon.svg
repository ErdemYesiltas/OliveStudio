<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Interim app icon (macOS grid: 824 px body, 100 px margin): a scene canvas with a selected object. Replace with the final brand mark. -->
