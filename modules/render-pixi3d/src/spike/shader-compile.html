<!doctype html><meta charset="utf-8"><title>shader compile spike</title>
<script type="module">
import '@pixi/3d';
import {probe} from './shader-compile';
// The editor's main app runs one backend; the other is probed hidden next to it, as the editor would.
const results = [];
for (const [main, other] of [['webgl', 'webgpu'], ['webgpu', 'webgl']]) {
  const {Application} = await import('pixi.js');
  const visible = new Application(); await visible.init({preference: main, width: 320, height: 180});
  document.body.appendChild(visible.canvas);
  try { results.push({main, hidden: await probe(other)}); } catch (error) { results.push({main, error: String(error)}); }
  try { results.push({main, same: await probe(main)}); } catch (error) { results.push({main, sameError: String(error)}); }
  visible.destroy(true);
}
window.__result = {userAgent: navigator.userAgent, results};
</script>
